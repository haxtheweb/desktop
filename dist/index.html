<!DOCTYPE html>
<html lang="en-US">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
	<title>HAX The Web</title>
	<style>
		body {
			margin: 0;
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
			font-family: system-ui, sans-serif;
			background: #ffffff;
			color: #262626;
		}

		@media (prefers-color-scheme: dark) {
			body {
				background: #1d1d1d;
				color: #ffffff;
			}
		}

		.loader {
			border: 12px solid #e4e5e7;
			border-radius: 50%;
			border-top: 12px solid #1e407c;
			border-bottom: 12px solid #1e407c;
			width: 80px;
			height: 80px;
			animation: spin 2s linear infinite;
		}

		@keyframes spin {
			0% {
				transform: rotate(0deg);
			}

			100% {
				transform: rotate(360deg);
			}
		}

		@media (prefers-reduced-motion: reduce) {
			.loader {
				animation: none;
			}
		}
	</style>
</head>

<body>
	<div class="loader" role="progressbar" aria-label="Starting HAXcms"></div>
</body>

</html>
