name: build
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Every platform: package, build the installers (kept as artifacts on the
  # run so they can be tried on a real machine) and test the packaged app.
  # Never signed: pull request code doesn't get near the signing secrets.
  package:
    uses: ./.github/workflows/package.yml
    with:
      haxcms-nodejs: main
      sign: false
